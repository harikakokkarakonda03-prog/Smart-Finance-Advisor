<!DOCTYPE html>
<html>

<head>
    <title>EMI Calculator</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<h2>Loan EMI Calculator</h2>

<form>

<label>Loan Amount:</label>
<input type="number" id="amount" placeholder="Enter Loan Amount">

<br><br>

<label>Interest Rate (%):</label>
<input type="number" id="rate" placeholder="Enter Interest Rate">

<br><br>

<label>Loan Period (months):</label>
<input type="number" id="time" placeholder="Enter Loan Period">

<br><br>

<button type="button" onclick="calculateEMI()">Calculate EMI</button>

</form>

<h3 id="result"></h3>

<script src="../js/script.js"></script>

</body>
</html>
